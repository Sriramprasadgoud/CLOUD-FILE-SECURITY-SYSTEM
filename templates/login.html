{% extends "base.html" %}
{% block title %}Sign In · Cloud File Security System{% endblock %}
{% block auth_content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="cfss-card p-4">
      <h1 class="h4 text-white mb-1">Sign in to Cloud Vault</h1>
      <p class="small text-secondary mb-4">AES-256-GCM encrypted file storage &amp; integrity verification.</p>
      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
          <label class="form-label small">Username or Email</label>
          <input type="text" name="identifier" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
      <p class="mt-3 mb-0 small text-secondary text-center">
        Need an account? <a href="{{ url_for('auth.register') }}">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
